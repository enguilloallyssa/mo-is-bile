name: flutter_application_2
description: "SARI Mobile Application"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.0
  http: ^1.6.0
  shared_preferences: ^2.5.3
  provider: ^6.1.5
  file_picker: ^11.0.3
  flutter_map: 8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.0.2
  flutter_secure_storage: ^10.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/sari-logo.png
    - assets/images/sari_s.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/sari-logo.png"

  adaptive_icon_background: "#080808"
  adaptive_icon_foreground: "assets/images/sari_s.png"
  adaptive_icon_foreground_inset: 12

  remove_alpha_ios: true
  min_sdk_android: 21